<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeldin Prelight - protect tool</title>
<style>body{background:#14161a;color:#d8dce3;font:15px system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}input,button{font:inherit;padding:8px 10px;margin:6px 0;width:100%;background:#262a32;color:#d8dce3;border:1px solid #2c313a;border-radius:6px;box-sizing:border-box}button{cursor:pointer;border-color:#f5a524}h1{color:#f5a524;font-size:20px}.n{color:#8a919e;font-size:13px;line-height:1.5}</style></head><body>
<h1>Zeldin Prelight - password protect tool</h1>
<p class="n">Runs only in your browser. Nothing is uploaded. Choose <b>app.html</b>, type a password, and download the protected <b>index.html</b> to publish.</p>
<input type="file" id="f" accept=".html">
<input type="password" id="p" placeholder="Password (16+ characters or 4+ random words)">
<button id="go">Create protected index.html</button>
<p class="n" id="m"></p>
<script>
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
async function enc(html,pw){const te=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),
 km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']),
 key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']),
 ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(html)));return{s:b64(salt),i:b64(iv),c:b64(ct)}}
const LOGIN=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeldin Prelight</title>
<style>html,body{height:100%;margin:0;background:#14161a;color:#d8dce3;font:15px system-ui,sans-serif}form{max-width:300px;margin:18vh auto;padding:0 16px}h1{color:#f5a524;font-size:20px;letter-spacing:.1em}input,button{font:inherit;width:100%;padding:9px 10px;margin:6px 0;box-sizing:border-box;background:#262a32;color:#d8dce3;border:1px solid #2c313a;border-radius:6px}button{cursor:pointer;border-color:#f5a524}p{color:#8a919e;min-height:1.2em}</style></head>
<body><form id="f"><h1>ZELDIN PRELIGHT</h1><input id="p" type="password" placeholder="Password" autofocus><button>Enter</button><p id="m"></p></form>
<script>
(()=>{const D={s:"__S__",i:"__I__",c:"__C__"};
const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('m');m.textContent='Checking...';
 try{const te=new TextEncoder(),km=await crypto.subtle.importKey('raw',te.encode(document.getElementById('p').value),'PBKDF2',false,['deriveKey']),
 k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']),
 pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},k,b(D.c));document.open();document.write(new TextDecoder().decode(pt));document.close()}
 catch(x){m.textContent='Wrong password.'}};})();
<\/script></body></html>`;
async function make(html,pw){const o=await enc(html,pw);return LOGIN.replace('__S__',o.s).replace('__I__',o.i).replace('__C__',o.c)}
if(typeof document!=='undefined'&&document.getElementById('go'))document.getElementById('go').onclick=async()=>{const m=document.getElementById('m'),f=document.getElementById('f').files[0],pw=document.getElementById('p').value;
 if(!crypto||!crypto.subtle){m.textContent='This browser blocks encryption on file:// pages. Run "python3 -m http.server" in this folder and open http://localhost:8000/protect.html instead.';return}
 if(!f){m.textContent='Choose app.html first.';return}if(pw.length<12){m.textContent='Use a password of at least 12 characters (longer is much safer).';return}
 m.textContent='Encrypting...';try{const out=await make(await f.text(),pw),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.download='index.html';a.click();m.textContent='Done. Upload index.html and the vendor folder to GitHub. Do NOT upload app.html or protect.html.'}catch(e){m.textContent='Failed: '+e}};
</script></body></html>
